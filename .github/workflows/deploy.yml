name: Deploy Java & DB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Java 배포 (SSH Remote Commands)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          key: ${{ secrets.SERVER_ACCESS_KEY }}       
          script: |
            cd /home/ubuntu/deploy/repo-vessel
            git checkout . && git clean -fd
            git pull origin main

            # 폴더 생성
            mkdir -p src/main/resources/resources
            
            # 파일 생성 (들여쓰기 없이 왼쪽 끝에 밀착!)
            cat <<'EOF' > src/main/resources/resources/database.properties
            db.driverClassName=com.mysql.jdbc.Driver
            db.url=${{ secrets.DB_URL }}
            db.username=${{ secrets.DB_USERNAME }}
            db.password=${{ secrets.DB_PASSWORD }}
            EOF

            # 파일이 진짜 생성됐는지 확인하는 로그 (Actions 콘솔에서 볼 수 있음)
            echo "--- 생성된 파일 내용 확인 ---"
            cat src/main/resources/resources/database.properties
            
            # 빌드 실행 시 캐시를 무시하도록 강제 (--no-cache 추가 권장)
            cd /home/ubuntu/deploy
            docker compose build --no-cache vessel-system
            docker compose up -d vessel-system
               
            echo "✅ 모든 작업이 완료되었습니다!"
