name: Deploy Java & DB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: #run 수동 버튼 생성

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: SSH Remote Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_NAME }}
        key: ${{ secrets.SERVER_ACCESS_KEY }}
        script: |
          echo "🚀 Java & DB '클린' 배포 시작..."
          
          # 1. 무조건 강제 삭제 (에러 방지 || true 추가)
          sudo rm -rf /home/ubuntu/deploy/repo-vessel || true
          
          # 2. 메인 브랜치 강제 다운로드
          cd /home/ubuntu/deploy
          git clone -b main https://github.com/newri0807/vessel-monitoring_system.git repo-vessel
          
          # 3. .env 파일 생성
          rm -f .env
          touch .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          
          # 4. 확인용 (이제 pom.xml 보일 겁니다)
          echo "📂 파일 목록 확인:"
          ls -F /home/ubuntu/deploy/repo-vessel
          
          # 5. 실행
          docker compose up -d --build vessel-system vms_db
          
          echo "✅ 배포 완료!"
