name: Deploy Java & DB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Java 배포 (SSH Remote Commands)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          key: ${{ secrets.SERVER_ACCESS_KEY }}
          script: |
            cd /home/ubuntu/deploy/repo-vessel
            
            # 1. pom.xml 구조에 맞춘 경로 생성
            mkdir -p src/resources
            
            # 2. 파일 생성 (드라이버는 pom.xml에 있는 mysql 드라이버 사용)
            cat <<'EOF' > src/resources/database.properties
            db.driverClassName=com.mysql.jdbc.Driver
            db.url=${{ secrets.DB_URL }}
            db.username=${{ secrets.DB_USERNAME }}
            db.password=${{ secrets.DB_PASSWORD }}
            EOF
            
            echo "🔎 파일 생성 결과 확인"
            ls -l src/resources/database.properties
            
            # 3. 도커 빌드 및 컨테이너 재시작
            cd /home/ubuntu/deploy
            docker compose up -d --build vessel-system
            
            echo "✅ 모든 작업이 완료되었습니다!"
