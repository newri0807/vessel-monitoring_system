name: Deploy Java & DB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Java 배포 (SSH Remote Commands)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_NAME }}
          key: ${{ secrets.SERVER_ACCESS_KEY }}   
          script: |
            cd /home/ubuntu/deploy/repo-vessel
            git checkout . && git clean -fd
            git pull origin main

            # 1. 표준 폴더 구조 생성
            mkdir -p src/main/java
            mkdir -p src/main/resources/resources
            mkdir -p src/main/resources/mappers
            mkdir -p src/main/webapp

            # 2. 자바 파일 이동
            find src -name "*.java" -exec mv {} src/main/java/ \; 2>/dev/null || true
            
            # 3. 모든 XML 설정 파일 이동 
            # 프로젝트 루트나 src에 흩어진 모든 .xml을 resources로 모음
            find src -name "*.xml" -not -name "pom.xml" -exec cp {} src/main/resources/ \; 2>/dev/null || true
            find src -name "*.xml" -not -name "pom.xml" -exec mv {} src/main/resources/mappers/ \; 2>/dev/null || true

            # 4. WebContent 내용 통째로 복사 (WEB-INF 폴더 누락 방지)
            if [ -d "WebContent" ]; then
              cp -r WebContent/* src/main/webapp/
            fi

            # 5. DB 설정 생성 (들여쓰기 주의!)
            cat <<'EOF' > src/main/resources/resources/database.properties
            db.driverClassName=com.mysql.jdbc.Driver
            db.url=${{ secrets.DB_URL }}
            db.username=${{ secrets.DB_USERNAME }}
            db.password=${{ secrets.DB_PASSWORD }}
            EOF

            # 6. 빌드 및 재시작
            cd /home/ubuntu/deploy
            docker compose up -d --build vessel-system
            
            echo "✅ 모든 작업이 완료되었습니다!"
               
