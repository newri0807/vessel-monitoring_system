name: Deploy Java & DB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: #run 수동 버튼 생성

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Java 배포 (SSH Remote Commands)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_NAME }}
        key: ${{ secrets.SERVER_ACCESS_KEY }}
        # 깃허브에 저장한 비밀번호를 이 스크립트로 넘겨줌
        envs: DB_URL, DB_USERNAME, DB_PASSWORD
        script: |
          echo "🚀 Java 배포 시작..."
          
          # 1. 기존 폴더 삭제 및 Clone
          sudo rm -rf /home/ubuntu/deploy/repo-vessel || true
          cd /home/ubuntu/deploy
          git clone -b main https://github.com/newri0807/vessel-system.git repo-vessel
          
          # 2. 프로젝트 폴더로 이동
          cd /home/ubuntu/deploy/repo-vessel
          
          # database.properties 파일 즉석 생성
          # 폴더가 없을 수도 있으니 먼저 생성
          mkdir -p src/main/resources
          
          echo "db.driverClassName=com.mysql.jdbc.Driver" > src/main/resources/database.properties
          echo "db.url=$DB_URL" >> src/main/resources/database.properties
          echo "db.username=$DB_USERNAME" >> src/main/resources/database.properties
          echo "db.password=$DB_PASSWORD" >> src/main/resources/database.properties
          
          echo "✅ 보안 파일 생성 완료!"

          # 3. 도커 실행 (이제 파일이 있으니 빌드 성공함)
          cd /home/ubuntu/deploy
          docker compose up -d --build vessel-system
