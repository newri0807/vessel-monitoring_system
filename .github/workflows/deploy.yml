name: Deploy Java & DB
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Java 배포 (SSH Remote Commands)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_NAME }}
        key: ${{ secrets.SERVER_ACCESS_KEY }}
        envs: DB_URL, DB_USERNAME, DB_PASSWORD
        script: |
          echo "Step 1: 소스 코드 다운로드"
          sudo rm -rf /home/ubuntu/deploy/repo-vessel || true
          cd /home/ubuntu/deploy
          
          git clone -b main https://github.com/newri0807/vessel-monitoring_system.git repo-vessel || exit 1
          
          echo "Step 2: 설정 파일 생성"
          cd /home/ubuntu/deploy/repo-vessel
          mkdir -p src/main/resources/resources
          
          # ⚠️ 기존의 Driver"" 오타 수정 및 변수 주입 방식 최적화
          cat <<EOF > src/main/resources/resources/database.properties
          db.driverClassName=com.mysql.jdbc.Driver
          db.url=${DB_URL}
          db.username=${DB_USERNAME}
          db.password=${DB_PASSWORD}
          EOF
          
          echo "🔎 생성된 파일 확인 (보안 주의)"
          cat src/main/resources/resources/database.properties
          
          echo "Step 3: 도커 실행"
          cd /home/ubuntu/deploy
          # 빌드 캐시를 무시하고 파일을 확실히 반영하기 위해 --no-cache 추가 가능
          docker compose up -d --build vessel-system
          
          echo "✅ 배포 완료!"
